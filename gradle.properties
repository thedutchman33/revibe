org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Single source of truth for the app, installer and in-app update checks.
revibeVersion=1.0.0
# Set by the release workflow. Leave blank in development to disable update checks.
revibeUpdateManifestUrl=
# Exact expected Authenticode subject/CN for the Windows installer. Blank blocks install
# unless unsigned GitHub-release updates are explicitly enabled by the release build.
revibePublisher=
# The current GitHub release is unsigned. Release builds opt in here; development builds do not.
revibeAllowUnsignedUpdates=false
# Publishable Supabase credentials baked into packaged builds. Leave blank here;
# provide the release secrets (or REVIBE_SUPABASE_URL / REVIBE_SUPABASE_ANON_KEY
# in the environment) so installed builds can sign in without extra setup.
revibeSupabaseUrl=
revibeSupabaseAnonKey=
