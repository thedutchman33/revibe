name: Clean Windows installer test

on:
  push:
    branches:
      - release-0.9.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build bundled app image
        shell: pwsh
        run: |
          $version = ((Select-String -Path gradle.properties -Pattern '^revibeVersion=').Line -split '=', 2)[1].Trim()
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & .\gradlew.bat :desktopApp:createDistributable "-PrevibeVersion=$version" --console=plain
          if ($LASTEXITCODE -ne 0) { throw "App-image build failed." }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Compile standalone EXE
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", `
            "C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $iscc) { throw "ISCC.exe was not found." }
          & $iscc.FullName "/DAppVersion=$env:VERSION" ".\desktopApp\installer\Revibe.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }
          $installer = ".\desktopApp\build\installer\Revibe-$env:VERSION-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not produced." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "INSTALLER_PATH=$((Resolve-Path $installer).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Built installer SHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Install per-user into a fresh directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "RevibeClean"
          if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          $p = Start-Process -FilePath $env:INSTALLER_PATH -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
            "/TASKS=desktopicon", "/DIR=$dir"
          )
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)." }

          $required = @(
            (Join-Path $dir "Revibe.exe"),
            (Join-Path $dir "runtime\lib\modules"),
            (Join-Path $dir "app\skiko-windows-x64.dll"),
            (Join-Path $dir "app\quackjs-jvm-0.1.4-dcfdfbd3d1498a0cf1de6fd4027379c.jar"),
            (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Revibe.lnk"),
            (Join-Path $env:USERPROFILE "Desktop\Revibe.lnk")
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing after install: $path" }
          }
          "CLEAN_INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch with no Java, JDK or Gradle in PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:JDK_HOME -ErrorAction SilentlyContinue
          $env:REVIBE_HOME = Join-Path $env:RUNNER_TEMP "RevibeCleanData"
          $env:REVIBE_PLAYBACK_ENGINE = "javafx"
          if (Test-Path -LiteralPath $env:REVIBE_HOME) { Remove-Item -LiteralPath $env:REVIBE_HOME -Recurse -Force }

          $app = Join-Path $env:CLEAN_INSTALL_DIR "Revibe.exe"
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 30
          $p.Refresh()
          if ($p.HasExited) { throw "Installed Revibe exited with $($p.ExitCode)." }
          $db = Join-Path $env:REVIBE_HOME "revibe.db"
          if (-not (Test-Path -LiteralPath $db)) { throw "Revibe did not create its fresh database." }
          if ($p.MainWindowHandle -eq 0) {
            Write-Warning "No MainWindowHandle in this non-interactive runner session; process startup and database creation passed."
          } else {
            "Window handle: $($p.MainWindowHandle)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          $running = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq "Revibe.exe" -and $_.ExecutablePath -eq $app
          }
          if ($null -eq $running) { throw "Installed Revibe process was not found." }
          "APP_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stop app
        if: always()
        shell: pwsh
        run: |
          Get-Process Revibe -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      - name: Uninstall and verify cleanup
        if: always()
        shell: pwsh
        run: |
          $dir = $env:CLEAN_INSTALL_DIR
          $uninstaller = Join-Path $dir "unins000.exe"
          if (Test-Path -LiteralPath $uninstaller) {
            $p = Start-Process -FilePath $uninstaller -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            )
            if ($p.ExitCode -ne 0) { throw "Uninstaller exited with $($p.ExitCode)." }
            Start-Sleep -Seconds 3
          }
          if (Test-Path -LiteralPath $dir) { throw "Install directory was not removed: $dir" }
          if (Test-Path -LiteralPath (Join-Path $env:USERPROFILE "Desktop\Revibe.lnk")) {
            throw "Desktop shortcut was not removed."
          }
          if (Test-Path -LiteralPath (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Revibe.lnk")) {
            throw "Start Menu shortcut was not removed."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:REVIBE_HOME "revibe.db"))) {
            throw "User data was deleted by uninstall."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Revibe-${{ env.VERSION }}-Setup
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 14
